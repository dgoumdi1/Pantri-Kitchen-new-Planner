kind = "web"
previewPath = "/"
title = "Pantri"
description = "A responsive kitchen inventory and meal-planning app with account-based kitchen data, recipe discovery, shopping lists, and a consent-gated Gemini assistant for cooking advice, structured recipes, and reviewed receipt or food-photo scans."
version = "1.0.0"
id = "artifacts/pantri"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19987

[services.development]
run = "pnpm --filter @workspace/pantri run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pantri", "run", "build" ]
serve = "static"
publicDir = "artifacts/pantri/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19987"
BASE_PATH = "/"
